name: Daily Property Scan

on:
  schedule:
    # Run at 5:00 AM UTC every day (12:00 noon Vietnam time)
    - cron: '0 5 * * *'
  workflow_dispatch:  # Allow manual trigger from GitHub UI

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scan-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run property scanner (Step 1 - Firecrawl)
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          cd ${{ github.workspace }}
          python main.py

      - name: Install Playwright for contact extraction
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Write portal cookies
        run: |
          mkdir -p cookies
          if [ -n "$BATDONGSAN_COOKIES" ]; then
            echo "$BATDONGSAN_COOKIES" > cookies/batdongsan.json
            echo "Wrote batdongsan cookies"
          else
            echo "No batdongsan cookies configured"
          fi
          if [ -n "$DOTPROPERTY_COOKIES" ]; then
            echo "$DOTPROPERTY_COOKIES" > cookies/dotproperty.json
            echo "Wrote dotproperty cookies"
          else
            echo "No dotproperty cookies configured"
          fi
        env:
          BATDONGSAN_COOKIES: ${{ secrets.BATDONGSAN_COOKIES }}
          DOTPROPERTY_COOKIES: ${{ secrets.DOTPROPERTY_COOKIES }}

      - name: Run FazWaz scraper (Playwright)
        run: python fazwaz_scraper.py
        env:
          DATA_DIR: data
          FAZWAZ_MAX_PER_TARGET: "15"

      - name: Extract broker contacts (Step 2 - Playwright)
        env:
          DATA_DIR: data
          COOKIES_DIR: cookies
          MAX_CONTACTS_PER_RUN: "50"
        run: |
          cd ${{ github.workspace }}
          python contact_extractor.py

      - name: Backfill batdongsan phone numbers
        env:
          DATA_DIR: data
          COOKIES_DIR: cookies
        run: |
          cd ${{ github.workspace }}
          python batdongsan_extractor.py

      - name: Build outreach dashboard
        run: python build_dashboard.py
        env:
          DATA_DIR: data
          OUTPUT_DIR: docs

      - name: Commit and push results
        run: |
          git config user.name "Vietnam Deal Bot"
          git config user.email "bot@vietnam-deals.github.io"
          git add data/ docs/outreach_dashboard.html docs/
          git diff --staged --quiet || git commit -m "Daily scan + contacts: $(date +%Y-%m-%d)"
          git push
